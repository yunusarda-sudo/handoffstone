name: Feature request
description: A concrete improvement to the core, the wire format, or the MCP adapter
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended design discussion belongs in [Discussions](https://github.com/yunusarda-sudo/handoffstone/discussions).
        The core stays stdlib-only. A change that hides a benchmark loss will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What fails or costs too much in a real handoff today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: constraint
    attributes:
      label: Constraint this must keep
      multiple: true
      options:
        - Stdlib only in handoffstone.py
        - No network and no API keys
        - Supersession, rationale, and evidence survive
        - Benchmark still reports losses
        - Existing JSONL records stay readable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How we would know it worked
      description: A test, a benchmark budget, or a cross-client trial that would change.
    validations:
      required: false
