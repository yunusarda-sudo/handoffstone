name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core tests
        run: python test_handoffstone.py

      - name: Reliability regressions
        run: python -B -m unittest -v test_reliability

      - name: Storage security regressions
        run: python test_storage_security.py

      - name: Cross-client transport fidelity
        run: python test_cross_client_fidelity.py

      - name: MCP protocol and core integration
        run: python test_mcp_bridge.py

      - name: Benchmark and negative controls
        run: python test_bench_handoffstone.py

      - name: Smoke test
        run: python handoffstone.py

      - name: Validate JSON Schema contract
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python test_schema_contract.py

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify source distribution in an isolated directory
        run: |
          expected_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test -n "$expected_version"
          install_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$install_dir" dist/*.tar.gz
          cd "$(mktemp -d)"
          EXPECTED_VERSION="$expected_version" PYTHONPATH="$install_dir" python -c 'import os; from importlib.metadata import version; import handoffstone; expected = os.environ["EXPECTED_VERSION"]; actual = version("handoffstone"); assert actual == expected, f"expected {expected}, got {actual}"; print(handoffstone.__file__)'

      - name: Verify wheel in an isolated directory
        run: |
          expected_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test -n "$expected_version"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          EXPECTED_VERSION="$expected_version" python -c 'import os; from importlib.metadata import version; import handoffstone; expected = os.environ["EXPECTED_VERSION"]; actual = version("handoffstone"); assert actual == expected, f"expected {expected}, got {actual}"; print(handoffstone.__file__)'
          python -m pip check
          EXPECTED_VERSION="$expected_version" python "$GITHUB_WORKSPACE/test_mcp_packaged_entrypoint.py"
