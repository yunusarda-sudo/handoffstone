name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core tests
        run: python test_handoffstone.py

      - name: Storage security regressions
        run: python test_storage_security.py

      - name: Benchmark and negative controls
        run: python test_bench_handoffstone.py

      - name: Smoke test
        run: python handoffstone.py

      - name: Validate JSON Schema contract
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python test_schema_contract.py

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify wheel in an isolated directory
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c "from importlib.metadata import version; import handoffstone; assert version('handoffstone') == '0.1.0a0'; print(handoffstone.__file__)"
          python -m pip check
