name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tagged release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core and storage tests
        run: |
          python test_handoffstone.py
          python test_storage_security.py
          python test_cross_client_fidelity.py
          python test_bench_handoffstone.py

      - name: Schema contract and package
        run: |
          python -m pip install 'jsonschema>=4,<5' build
          python test_schema_contract.py
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -c "from importlib.metadata import version; import handoffstone; assert version('handoffstone') == '0.1.0a0'; print(handoffstone.__file__)"
