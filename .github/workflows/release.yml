name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tagged release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core and storage tests
        run: |
          python test_handoffstone.py
          python -B -m unittest -v test_reliability
          python test_storage_security.py
          python test_cross_client_fidelity.py
          python test_mcp_bridge.py
          python test_bench_handoffstone.py

      - name: Verify tag matches project version
        run: |
          project_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          release_version="${GITHUB_REF_NAME#v}"
          test -n "$project_version"
          if [ "$project_version" != "$release_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

      - name: Schema contract and package
        run: |
          python -m pip install 'jsonschema>=4,<5' build
          python test_schema_contract.py
          python -m build
          install_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$install_dir" dist/*.tar.gz
          cd "$(mktemp -d)"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" PYTHONPATH="$install_dir" python -c 'import os; from importlib.metadata import version; import handoffstone; expected = os.environ["RELEASE_VERSION"]; actual = version("handoffstone"); assert actual == expected, f"expected {expected}, got {actual}"; print(handoffstone.__file__)'
          cd "$GITHUB_WORKSPACE"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" python -c 'import os; from importlib.metadata import version; import handoffstone; expected = os.environ["RELEASE_VERSION"]; actual = version("handoffstone"); assert actual == expected, f"expected {expected}, got {actual}"; print(handoffstone.__file__)'
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" python "$GITHUB_WORKSPACE/test_mcp_packaged_entrypoint.py"
