[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffstone"
version = "0.1.0a0"
description = "Portable, verifiable, decision-aware context handoffs for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "handoffstone contributors" }]
keywords = ["ai-agents", "context", "handoff", "memory", "mcp", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/yunusarda-sudo/handoffstone"

[tool.setuptools]
py-modules = ["handoffstone"]

[tool.setuptools.data-files]
"share/handoffstone/schema" = ["schema/handoff.schema.json"]
